title: "Lucas Tajes"
description: "Performance, growth e liderança de times. Mídia paga, análise de dados, SEO, CRO e automação conectados ao resultado do negócio."
url: "https://lucasmtajes-lgtm.github.io"
baseurl: "/Portfolio"
lang: "pt-BR"
locale: "pt_BR"
github_username: lucasmtajes-lgtm
linkedin_username: lucas-tajes
logo: "/assets/images/favicon.svg"
image: "/assets/images/lucas-tajes.jpg"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  cases:
    output: true
    permalink: /cases/:name/
  automation:
    output: true
    permalink: /automation/:name/

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/lucas-tajes.jpg"
  - scope:
      path: ""
      type: "cases"
    values:
      layout: case
  - scope:
      path: ""
      type: "automation"
    values:
      layout: automation

exclude:
  - Gemfile
  - Gemfile.lock
  - plan.md
  - TODO.md
  - COMO-PUBLICAR.md
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - CNAME
  - .gitignore
  - scripts
  - "dados e foto"
  - .vscode
  - .idea
  - .manus
  - .work
  - inputs
  - outputs

sass:
  style: compressed
